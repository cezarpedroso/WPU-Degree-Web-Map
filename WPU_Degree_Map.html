<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WPU Degree Requirements & Prerequisites</title>
<style>
:root{--bg:#f5f1e8;--panel:#fffdf8;--ink:#1e1a16;--mut:#6a6357;--line:#d6ccb8;--acc:#7a1f2b;--chip:#ebe4d4;--nl:93%;--nb:42%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15120e;--panel:#1d1915;--ink:#eee7d8;--mut:#a59b89;--line:#453d31;--acc:#e59aa2;--chip:#2a251e;--nl:22%;--nb:62%}}
:root[data-theme="dark"]{--bg:#15120e;--panel:#1d1915;--ink:#eee7d8;--mut:#a59b89;--line:#453d31;--acc:#e59aa2;--chip:#2a251e;--nl:22%;--nb:62%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
h1,h2,.brand{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:600;margin:0}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-size:18px;cursor:pointer;margin-right:auto}
input,select,button{font:inherit;color:var(--ink)}
input,select{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);max-width:100%}
input{width:260px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:4px 10px;cursor:pointer}.btn:hover{border-color:var(--acc)}
#v{flex:1;min-height:0;overflow:auto}
.home{padding:14px clamp(12px,2.5vw,28px) 30px}
.hint{color:var(--mut);margin-bottom:12px}.hint h1{font-size:22px;color:var(--ink);margin-bottom:2px}
.cols{column-width:290px;column-gap:12px}
.dv{break-inside:avoid;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:5px;padding:9px 12px 6px;margin-bottom:12px}
.dv h2{font-size:16px;margin-bottom:2px}.dv h4{margin:8px 0 3px;font-size:11.5px;color:var(--mut);font-weight:600}
.pill{display:inline-block;margin:0 4px 4px 0;padding:2px 8px;border-radius:4px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:13px}
.pill:hover{border-color:var(--acc);color:var(--acc)}.pill.maj{background:var(--acc);border-color:var(--acc);color:var(--panel)}.pill.maj:hover{opacity:.85;color:var(--panel)}.pill.off{opacity:.2}
.pg{max-width:1100px;margin:0 auto;padding:18px clamp(14px,3vw,32px) 60px}
.crumb{color:var(--mut)}.lk{color:var(--acc);cursor:pointer;text-decoration:underline;background:none;border:0;padding:0}
.pg h1{font-size:28px;margin:4px 0}.meta{color:var(--mut)}
.sum{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.sum div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px}.sum b{font-size:18px;margin-right:4px}
.leg{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:12.5px;color:var(--mut);margin:6px 0 4px}
.chip{display:inline-flex;gap:6px;align-items:baseline;border:1.5px solid var(--acc);background:var(--panel);border-radius:7px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.chip b{font:700 12px ui-monospace,Menlo,Consolas,monospace}.chip span{font-size:12px;color:var(--mut)}
.chip.in{background:var(--acc);color:var(--panel)}.chip.in span{color:inherit;opacity:.85}.chip.out{border-style:dashed}
.chip:hover{box-shadow:0 0 0 2px var(--chip)}
h2.sec{font-size:20px;margin:30px 0 4px;padding-bottom:4px;border-bottom:2px solid var(--acc)}h3{font-size:14px;margin:16px 0 6px;color:var(--mut)}
.row{display:grid;grid-template-columns:280px 1fr;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.card{text-align:left;background:var(--panel);border:1px solid var(--line);border-left:5px solid hsl(var(--h) 45% var(--nb));border-radius:8px;padding:7px 10px;cursor:pointer;display:grid;gap:1px}
.card:hover{border-color:var(--acc)}.card b{font:700 13px ui-monospace,Menlo,Consolas,monospace}.card span{font-size:13px}.card em{font-style:normal;font-size:12px;color:var(--mut)}
.card.ph{border-style:dashed;cursor:default}
.need{display:flex;align-items:center;gap:8px;min-width:0;overflow-x:auto;padding:2px}
.ar{color:var(--acc);font-size:16px}.none{color:var(--mut);font-style:italic}
.nd{display:flex;align-items:center;gap:6px}.kids{display:flex;flex-direction:column;gap:5px;border-left:2px solid var(--line);padding-left:10px}
.raw{font-size:12px;color:var(--mut);margin-left:6px;white-space:normal;max-width:260px}
.alt{border:1.5px dashed var(--mut);border-radius:10px;padding:0 10px 4px;margin:8px 0}.alt>.lbl{font-size:12px;color:var(--mut);margin-top:-9px;background:var(--bg);display:inline-block;padding:0 6px;position:relative;top:-1px}
.tot{color:var(--mut);font-size:13px;margin:6px 0}.note{color:var(--mut);font-size:13px}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 30px #0003;padding:20px;overflow:auto;transform:translateX(105%);transition:transform .18s;z-index:5}#dr.open{transform:none}
#dr h2{margin:0 0 2px;font-size:22px}#dr h3{color:var(--acc);margin:16px 0 4px}#dr .x{float:right;font-size:22px;border:0;background:none;cursor:pointer}#dr ul{margin:0;padding-left:18px}.mut{color:var(--mut)}
.tog{display:inline-flex;margin:12px 0 0}.tog .btn{border-radius:0}.tog .btn:first-child{border-radius:7px 0 0 7px}.tog .btn:last-child{border-radius:0 7px 7px 0}.btn.on{background:var(--acc);border-color:var(--acc);color:var(--panel)}
.pg.wide{max-width:none}.gs{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-top:8px}
.band{fill:none}.band.b1{fill:var(--chip);opacity:.5}.bl{font-size:12.5px;font-weight:600;fill:var(--ink)}.col{font-size:11px;fill:var(--mut)}
.n{cursor:pointer}.n rect{fill:hsl(var(--h) 45% var(--nl));stroke:hsl(var(--h) 40% var(--nb));stroke-width:1.5}
.n.alt rect{stroke-dasharray:5 3}.n.ext{opacity:.6}.n.ext rect{stroke-dasharray:2 3}.n.ph{cursor:default}.n.ph rect{fill:none}
.n text{fill:var(--ink);pointer-events:none}.n .c{font:700 12px ui-monospace,Menlo,Consolas,monospace}.n .t{font-size:11px;fill:var(--mut)}
.n:hover rect,.n.on rect{stroke:var(--acc);stroke-width:3}.n.dim{opacity:.13}
.e{fill:none;stroke:var(--mut);stroke-width:1.3;opacity:.5;marker-end:url(#ah)}.e.hl{stroke:var(--acc);stroke-width:2.4;opacity:1;marker-end:url(#ahh)}.e.dim{opacity:.05}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px;background:hsl(var(--h) 45% var(--nl));border:1.5px solid hsl(var(--h) 40% var(--nb))}.sw.d{border-style:dashed}
details.nt{margin-top:14px;color:var(--mut)}details.nt div{padding:1px 0}
@media (max-width:760px){.row{grid-template-columns:1fr}input{width:100%}}
</style></head><body>

function gbuild(p,blocks){

function show(id){
